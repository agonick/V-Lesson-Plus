name: Release on Merge to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Build Firefox package
        run: npm run build:firefox

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create extension zip
        run: |
          zip -r "v-lesson-plus-chrome-v${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            src/popup/popup.html \
            src/popup/popup.css \
            icons/ \
            dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "V-Lesson Plus v${{ steps.version.outputs.version }}"
          body: |
            Automated release for V-Lesson Plus v${{ steps.version.outputs.version }}.

            Download the Chrome zip and unzip it to load the extension as an unpacked extension in Chrome.
            Download the Firefox zip to submit or self-distribute through Mozilla.
          files: |
            v-lesson-plus-chrome-v${{ steps.version.outputs.version }}.zip
            web-ext-artifacts/v-lesson_plus-${{ steps.version.outputs.version }}.zip
          make_latest: true
